--- 
- name: Установка стандартных пакетов
  hosts: server
  roles:
    - role: default_packages
  tags:
    - install_packages

- name: Установка и настройка nginx c кастомной страницей
  hosts: nginx
  roles:
    - role: nginx
  tags:
    - nginx

- name: Установка и настрока прокси nginx
  hosts: nginx-proxy
  roles:
    - role: nginx-proxy
  tags:
    - nginx-proxy